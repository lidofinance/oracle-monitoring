server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name depositor.f4ever.pl;
    ssl_certificate /etc/letsencrypt/live/depositor.f4ever.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depositor.f4ever.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / { return 302 /depositor/; }
    location = /depositor { include /etc/nginx/snippets/depositor-proxy.conf; }
    location = /depositor/ { include /etc/nginx/snippets/depositor-proxy.conf; }
    include /etc/nginx/snippets/council-routes.conf;
    location = /api/depositor { include /etc/nginx/snippets/depositor-proxy.conf; }
    location /assets/ { include /etc/nginx/snippets/depositor-proxy.conf; }
    location = /favicon.svg { include /etc/nginx/snippets/depositor-proxy.conf; }
    location = /og.png { include /etc/nginx/snippets/depositor-proxy.conf; }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name depositor.f4ever.pl;
    return 301 https://$host$request_uri;
}
