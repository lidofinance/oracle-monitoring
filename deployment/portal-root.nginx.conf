# Replace f4ever.pl's former exact-root Oracle redirect with this include.
# /portal is internal to the shared root-path monitor runtime; /oracle keeps
# using the existing standalone Oracle service.
location = / {
    proxy_pass http://127.0.0.1:3012/portal;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}

# Withdrawal Watch uses the same runtime and existing shared API routes.
location = /withdrawals { include /etc/nginx/snippets/depositor-proxy.conf; }
location = /withdrawals/ { include /etc/nginx/snippets/depositor-proxy.conf; }
