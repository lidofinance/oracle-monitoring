# Replace f4ever.pl's former exact-root Oracle redirect with this include.
# /portal is internal to the shared root-path monitor runtime; /oracle keeps
# using the existing standalone Oracle service.
location = / {
    proxy_pass http://127.0.0.1:3012/portal;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
}

# Old browsers may still replay the former permanent / -> /oracle redirect.
# Retire that bare entry point through a query URL that avoids the cached /.
# The Oracle dashboard and all of its deep links stay under /oracle/overview,
# /oracle/telemetry and /oracle/reports on the separate Oracle service.
location = /oracle {
    add_header Cache-Control "no-store" always;
    if ($arg_network = hoodi) { return 302 /?network=hoodi; }
    return 302 /?network=mainnet;
}
location = /oracle/ {
    add_header Cache-Control "no-store" always;
    if ($arg_network = hoodi) { return 302 /?network=hoodi; }
    return 302 /?network=mainnet;
}

# Withdrawal Watch uses the same runtime and existing shared API routes.
location = /withdrawals { include /etc/nginx/snippets/depositor-proxy.conf; }
location = /withdrawals/ { include /etc/nginx/snippets/depositor-proxy.conf; }
